# General Information about this style
#
# name e style_version li riscrive il deploy Ansible nel clone temporaneo, prima
# di copiare: ogni versione pubblicata vive in una directory propria e phpBB
# tratta style_name come unico, quindi due versioni affiancate non possono
# chiamarsi allo stesso modo. I valori qui sotto sono quelli dell'ambiente di
# test locale, che pubblica il repo com'e'.
